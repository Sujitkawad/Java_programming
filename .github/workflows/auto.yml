name: Auto Commit (2 times daily)

on:
  schedule:
    - cron: "0 8 * * *"     # Morning commit (8 AM UTC)
    - cron: "0 20 * * *"    # Night commit (8 PM UTC)
  workflow_dispatch:

jobs:
  run:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Update File
        run: |
          echo %DATE% %TIME% >> auto-update.txt
        shell: cmd

      - name: Commit Changes
        run: |
          git config --global user.email "sujitkawad@gmail.com"
          git config --global user.name "Sujitkawad"
          git add .
          git commit -m "Auto Commit" || echo No changes to commit
          git push
        shell: cmd
